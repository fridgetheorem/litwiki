site_name: Literature Wiki
docs_dir: /home/user/vault
use_directory_urls: true
strict: false

exclude_docs: |
  _pdfs/
  notes/
  .obsidian/
  .stfolder/
  .stversions/
  .trash/
  *.sync-conflict-*
  .*.tmp

hooks:
  - hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true


validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
  omitted_files: ignore
