<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project papers · litwiki</title>
<style>
__THEME__
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.bar .sp{flex:1}.bar a.b{text-decoration:none}
input[type=search],input.tin{padding:.35rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1;min-width:10rem;max-width:22rem}
.b{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:.4rem .9rem;font:inherit;font-weight:600;cursor:pointer}
.b.sec{background:none;color:var(--acc);border:1px solid var(--acc)}
#tagbar{display:flex;gap:.4rem;flex-wrap:wrap;padding:.6rem 1rem 0;align-items:center}
.chipw{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.chipw .chip{border:0;border-radius:0}.chipw.on{border-color:var(--acc)}
.chipw .cx{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 .5rem 0 .1rem;font-size:.9rem}.chipw .cx:hover{color:var(--bad)}
.chipw.on .cx{background:var(--acc);color:var(--accfg)}
.chip .ct{opacity:.65;margin-left:.3rem;font-size:.75rem}
#newtag{font-size:.82rem;padding:.1rem .6rem;width:8.5rem;border-radius:999px}
#dlg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30;padding:1rem}
#dlg .box{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column}
#dlg header{padding:.9rem 1.1rem .5rem;font-weight:600}#dlg .sub{padding:0 1.1rem .5rem;color:var(--mut);font-size:.88rem}
#dlg .body{overflow:auto;padding:.3rem 1.1rem;display:flex;flex-direction:column;gap:.55rem}
#dlg footer{padding:.8rem 1.1rem;display:flex;gap:.6rem;align-items:center;border-top:1px solid var(--line)}
.sg{border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:var(--card)}
.sg .st{font-size:.92rem;font-weight:600}.sg .have{font-size:.8rem;color:var(--mut)}
.sg label{display:inline-flex;align-items:center;gap:.25rem;margin:.25rem .7rem 0 0;font-size:.85rem;cursor:pointer}
.sg label.new b{color:var(--acc);font-weight:600}.sg .none{font-size:.82rem;color:var(--mut)}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .65rem;background:none;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#list{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem;padding:1rem;align-items:stretch}
.p{position:relative;display:flex;flex-direction:column;gap:.45rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;touch-action:manipulation}
.p.lift{opacity:.35}
.ph{display:flex;align-items:center;gap:.5rem}
.h{cursor:grab;touch-action:none;user-select:none;color:var(--mut);font-size:1.15rem;line-height:1;padding:.25rem .4rem;margin:-.25rem 0 -.25rem -.4rem;border-radius:6px}.h:hover{color:var(--acc);background:var(--bg)}
.n{color:var(--mut);font-variant-numeric:tabular-nums;font-size:.85rem}.ph .sp{flex:1}
.ph button.mvb{border:1px solid var(--line);background:none;color:var(--mut);border-radius:6px;cursor:pointer;font-size:.8rem;padding:0 .4rem}.ph button.mvb:hover{color:var(--acc);border-color:var(--acc)}
.bd{display:flex;flex-direction:column;gap:.35rem;flex:1}
.bd h3{margin:0;font-size:1rem;line-height:1.3}.bd h3 a{color:var(--fg);text-decoration:none}.bd h3 a:hover{color:var(--acc)}
#ins{position:absolute;width:4px;border-radius:2px;background:var(--acc);box-shadow:0 0 0 2px var(--bg);pointer-events:none;display:none;z-index:4}
#ghost{position:fixed;z-index:20;pointer-events:none;opacity:.9;box-shadow:0 10px 30px #0005;transform:rotate(1.5deg);display:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.by{font-size:.84rem;color:var(--mut)}
.tg{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.tg .t{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 .2rem 0 .6rem;display:inline-flex;align-items:center;gap:.15rem}
.tg .t button{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 .3rem;font-size:.9rem}
.tg .t[draggable=true]{cursor:grab}.tg .t.over{outline:2px solid var(--acc)}
.tg .t.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}.tg .t.pri button{color:var(--accfg);opacity:.8}
.sg .pk{color:var(--acc);font-weight:700}
.tg .t button:hover{color:var(--bad)}
input.tin{font-size:.82rem;padding:.1rem .5rem;width:9rem}
.row{display:flex;gap:.9rem;margin-top:auto;font-size:.84rem;flex-wrap:wrap}.row a,.row button{color:var(--acc);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:none}
.row button.un{color:var(--mut)}
#empty{padding:3rem 1rem;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem 1rem;border-radius:8px;display:none;z-index:9;max-width:90vw}
</style></head><body>
__NAV__<div class="pview">
__TABS__
<div class="bar"><input id="q" type="search" placeholder="Filter this project's papers"><span id="info" class="by"></span><span class="sp"></span>
<button class="b sec" id="bib" type="button" title="Copy BibTeX entries for the papers shown (all of them unless you are filtering)">Copy BibTeX</button><a class="by" id="bibdl" href="__BIBDL__" title="Download every paper's entry as a .bib file" download>.bib</a>
<button class="b sec" id="suggest" type="button" title="Ask the AI to tag your papers: you review the suggestions before anything is saved">Suggest tags…</button>
<a class="b" href="__ADD__">+ Add papers</a></div>
<div id="tagbar"></div>
<div id="list"><div id="ins"></div></div><div id="ghost" class="p"></div><div id="empty" style="display:none"></div></div>
<div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="box"><header id="dlgt"></header><div class="sub" id="dsub"></div><div class="body" id="dbody"></div>
<footer><label><input type="checkbox" id="onlyun"> Only papers with no tags</label><span style="flex:1"></span><button class="b sec" id="dcancel" type="button">Close</button><button class="b" id="dgo" type="button">Suggest</button></footer></div></div>
<div id="toast" role="status"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById("data").textContent),CSRF="__CSRF__",BASE="/app/project/"+encodeURIComponent(D.slug);
let papers=D.papers,q="",picked=new Set(),vocab=D.vocab||[];   // picked: the tags a paper must ALL have to be shown
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4000)}
async function post(path,params){
  const body=new URLSearchParams({_csrf:CSRF});for(const[k,v] of Object.entries(params||{}))(Array.isArray(v)?v:[v]).forEach(x=>body.append(k,x));
  const r=await fetch(path,{method:"POST",body,credentials:"same-origin"});
  if(r.redirected&&r.url.includes("/app/login"))throw new Error("Session expired: log in again, then reload.");
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.error||(r.status===403?"Session expired: reload this page.":"Server error ("+r.status+")"));
  return j}
const filtering=()=>!!(q||picked.size);
function matches(p){const w=q.toLowerCase().split(/\s+/).filter(Boolean),h=(p.title+" "+p.authors+" "+p.venue+" "+p.year+" "+p.tags.join(" ")).toLowerCase();
  return w.every(x=>h.includes(x))&&[...picked].every(t=>p.tags.includes(t))}
async function saveOrder(){try{await post(BASE+"/order",{stem:papers.map(p=>p.stem)})}catch(e){toast(e.message)}}
function move(i,j){if(j<0||j>=papers.length||i===j)return;const[x]=papers.splice(i,1);papers.splice(j,0,x);render();saveOrder()}
/* Drag with pointer events (mouse, touch, pen). The insertion bar shows the gap the card will drop into. */
let drag=null;
function gap(x,y){ // -> {idx, bar:{x,y,h}} the slot nearest the pointer, in terms of the cards shown
  const L=$("list"),lr=L.getBoundingClientRect(),cs=[...L.querySelectorAll(".p")];if(!cs.length)return null;
  let best=null,bd=1e9;
  cs.forEach((c,k)=>{const r=c.getBoundingClientRect(),dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom),d=dx*dx+dy*dy;
    if(d<bd){bd=d;best={c,k,r,after:x>r.left+r.width/2}}});
  const idx=best.k+(best.after?1:0),px=(best.after?best.r.right+6:best.r.left-6)-lr.left;
  return{idx,bar:{x:px-2,y:best.r.top-lr.top,h:best.r.height}}}
function startDrag(e,i,card){
  if(e.button!==undefined&&e.button!==0)return;e.preventDefault();
  const r=card.getBoundingClientRect(),g=$("ghost");
  g.style.cssText="display:block;width:"+r.width+"px;left:"+r.left+"px;top:"+r.top+"px";g.replaceChildren(...card.cloneNode(true).childNodes);
  drag={i,dx:e.clientX-r.left,dy:e.clientY-r.top,card,id:e.pointerId,idx:i};card.classList.add("lift");document.body.classList.add("dragging");
  try{e.target.setPointerCapture(e.pointerId)}catch(_){}
  addEventListener("pointermove",onMove);addEventListener("pointerup",endDrag);addEventListener("pointercancel",cancelDrag);addEventListener("keydown",onKey);
  onMove(e)}
function onMove(e){
  if(!drag)return;const g=$("ghost");g.style.left=(e.clientX-drag.dx)+"px";g.style.top=(e.clientY-drag.dy)+"px";
  const h=innerHeight,m=70;if(e.clientY<m)scrollBy(0,-14);else if(e.clientY>h-m)scrollBy(0,14);
  const s=gap(e.clientX,e.clientY),ins=$("ins");if(!s){ins.style.display="none";return}
  drag.idx=s.idx;ins.style.cssText="display:block;left:"+s.bar.x+"px;top:"+s.bar.y+"px;height:"+s.bar.h+"px"}
function stopDrag(){removeEventListener("pointermove",onMove);removeEventListener("pointerup",endDrag);removeEventListener("pointercancel",cancelDrag);removeEventListener("keydown",onKey);
  document.body.classList.remove("dragging");$("ghost").style.display="none";$("ins").style.display="none";drag&&drag.card.classList.remove("lift")}
function endDrag(){const d=drag;stopDrag();drag=null;if(!d)return;
  let j=d.idx;if(j>d.i)j--;                       // slot index counts the lifted card, so shift when moving later
  if(j!==d.i)move(d.i,j)}
function cancelDrag(){stopDrag();drag=null}
function onKey(e){if(e.key==="Escape")cancelDrag()}
async function setTags(p,tags){try{const r=await post(BASE+"/tags",{stem:p.stem,tags});p.tags=r.tags;render()}catch(e){toast(e.message)}}
async function unlink(p){
  if(!confirm("Remove “"+p.title+"” from this project? The paper stays in your library."))return;
  try{await post(BASE+"/act",{action:"unlink",id:"page:"+p.stem});papers=papers.filter(x=>x!==p);render();toast("Removed from project.")}catch(e){toast(e.message)}}
function row(p){
  const i=papers.indexOf(p),d=el("div","p");
  const ph=el("div","ph");
  if(!filtering()){const h=el("span","h","⋮⋮");h.title="Drag to reorder";h.onpointerdown=e=>startDrag(e,i,d);ph.append(h)}
  ph.append(el("span","n","#"+(i+1)),el("span","sp"));
  if(!filtering()){const l=el("button","mvb","◀");l.type="button";l.title="Move earlier";l.onclick=()=>move(i,i-1);
    const r=el("button","mvb","▶");r.type="button";r.title="Move later";r.onclick=()=>move(i,i+1);ph.append(l,r)}
  d.append(ph);
  const b=el("div","bd"),h3=el("h3"),a=el("a","",p.title);a.href="/papers/"+encodeURIComponent(p.stem)+"/";h3.append(a);b.append(h3);
  const by=[p.authors,[p.venue,p.year].filter(Boolean).join(" ")].filter(Boolean).join(" · ");if(by)b.append(el("div","by",by));
  const tg=el("div","tg");
  /* The first tag is the paper's primary tag (its colour on the map). Drag a tag onto another to reorder; ☆ makes one primary. */
  p.tags.forEach((t,k)=>{const s=el("span","t"+(k?"":" pri"),(k?"":"★ ")+t);s.draggable=true;
    s.title=k?"Drag to reorder; ☆ makes it the primary tag":"Primary tag (colours this paper on the map). Drag another tag here to replace it.";
    s.ondragstart=e=>{e.dataTransfer.setData("text/plain",String(k));e.dataTransfer.effectAllowed="move"};
    s.ondragover=e=>{e.preventDefault();s.classList.add("over")};s.ondragleave=()=>s.classList.remove("over");
    s.ondrop=e=>{e.preventDefault();s.classList.remove("over");const f=+e.dataTransfer.getData("text/plain");if(isNaN(f)||f===k)return;
      const a=[...p.tags],[m]=a.splice(f,1);a.splice(k,0,m);setTags(p,a)};
    if(k){const st=el("button","","☆");st.type="button";st.title="Make primary";st.setAttribute("aria-label","Make "+t+" the primary tag");st.onclick=()=>setTags(p,[t,...p.tags.filter(y=>y!==t)]);s.append(st)}
    const x=el("button","","×");x.type="button";x.title="Remove tag";x.onclick=()=>setTags(p,p.tags.filter(y=>y!==t));s.append(x);tg.append(s)});
  const full=p.tags.length>=4,inp=el("input","tin");inp.placeholder=full?"4 tags max":"+ tag";inp.disabled=full;inp.setAttribute("list","alltags");inp.maxLength=40;
  inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();setTags(p,[...p.tags,inp.value.trim()])}};
  tg.append(inp);b.append(tg);
  const r=el("div","row");
  const w=el("a","","Wiki page");w.href="/papers/"+encodeURIComponent(p.stem)+"/";r.append(w);
  if(p.pdf){const a2=el("a","","Read & annotate");a2.href="/app/paper/"+encodeURIComponent(p.stem)+"/read";r.append(a2)}
  const n=el("a","","Notes");n.href=BASE+"/notes";r.append(n);
  const un=el("button","un","Remove from project");un.type="button";un.onclick=()=>unlink(p);r.append(un);
  b.append(r);d.append(b);
  return d}
function counts(){const m=new Map(vocab.map(v=>[v.tag,0]));papers.forEach(p=>p.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)));return m}
async function delTag(t,n){
  if(!confirm("Delete the tag “"+t+"”?"+(n?" It will be removed from "+n+" paper"+(n===1?"":"s")+".":"")))return;
  try{await post(BASE+"/tags/delete",{tag:t});papers.forEach(p=>{p.tags=p.tags.filter(x=>x!==t)});vocab=vocab.filter(v=>v.tag!==t);picked.delete(t);render();toast("Tag deleted.")}catch(e){toast(e.message)}}
async function defTag(v){try{const r=await post(BASE+"/tags/define",{tag:v});if(!vocab.some(x=>x.tag===r.tag))vocab.push({tag:r.tag,count:0});render();toast("Tag “"+r.tag+"” added.")}catch(e){toast(e.message)}}
function render(){
  const cm=counts(),all=[...cm.keys()].sort(),tb=$("tagbar");tb.replaceChildren();
  [...picked].forEach(t=>{if(!all.includes(t))picked.delete(t)});
  if(all.length){const c0=el("button","chip"+(picked.size?"":" on"),"All");c0.type="button";c0.onclick=()=>{picked.clear();render()};tb.append(c0)}
  all.forEach(t=>{const on=picked.has(t),w=el("span","chipw"+(on?" on":"")),c=el("button","chip"+(on?" on":""),t);c.type="button";
    c.title="Click to show only this tag. Shift-click (or Ctrl/⌘-click) adds or removes a tag: papers with all the picked tags are shown.";
    c.onclick=e=>{if(e.shiftKey||e.ctrlKey||e.metaKey){picked.has(t)?picked.delete(t):picked.add(t)}else if(picked.size===1&&on){picked.clear()}else{picked.clear();picked.add(t)}render()};
    c.append(el("span","ct",String(cm.get(t))));
    const x=el("button","cx","×");x.type="button";x.title="Delete this tag (removes it from every paper)";x.setAttribute("aria-label","Delete tag "+t);x.onclick=()=>delTag(t,cm.get(t));
    w.append(c,x);tb.append(w)});
  const nt=el("input","tin");nt.id="newtag";nt.placeholder="+ new tag";nt.maxLength=40;nt.title="Define a tag before any paper uses it";
  nt.onkeydown=e=>{if(e.key==="Enter"&&nt.value.trim()){e.preventDefault();defTag(nt.value.trim())}};tb.append(nt);
  let dl=$("alltags");if(!dl){dl=document.createElement("datalist");dl.id="alltags";document.body.append(dl)}
  dl.replaceChildren(...all.map(t=>{const o=document.createElement("option");o.value=t;return o}));
  const sh=papers.filter(matches),L=$("list"),active=document.activeElement&&document.activeElement.classList.contains("tin");
  L.replaceChildren($("ins"),...sh.map(row));
  $("info").textContent=sh.length===papers.length?papers.length+" paper"+(papers.length===1?"":"s"):sh.length+" of "+papers.length+" shown"+(picked.size>1?" with all of: "+[...picked].join(" + "):"")+" (clear the filter to reorder)";
  const e=$("empty");e.style.display=sh.length?"none":"block";
  e.replaceChildren();
  if(!papers.length){e.append("No papers in this project yet. ");const a=el("a","","Add papers");a.href=D.add;e.append(a,".")}else e.textContent="Nothing matches this filter."}
$("q").oninput=e=>{q=e.target.value;render()};
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise((ok,no)=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.append(a);a.select();
    try{document.execCommand("copy")?ok():no(new Error("Copy was blocked: use the .bib download instead."))}catch(e){no(e)}finally{a.remove()}})}
$("bib").onclick=async()=>{
  const sh=papers.filter(matches);
  try{const r=await post(BASE+"/bibtex",{subset:"1",stem:sh.map(p=>p.stem)});
    if(!r.count)return toast("No BibTeX to copy.");
    await copyText(r.bibtex);toast("Copied "+r.count+" BibTeX entr"+(r.count===1?"y":"ies")+(sh.length<papers.length?" (shown papers only).":"."))}
  catch(e){toast(e.message||"Copy failed.")}};
/* Suggest tags: the model proposes, you tick what to keep; only additions are ever applied. */
let sug=null;
const dlg=$("dlg");
function openDlg(){dlg.style.display="flex";$("dlgt").textContent="Suggest tags";$("dsub").textContent="The AI reads each paper's title, authors and summary, prefers your existing tags, and may coin new ones. Nothing is saved until you apply.";
  $("dbody").replaceChildren();$("dgo").textContent="Suggest";$("dgo").disabled=false;$("onlyun").parentElement.style.display="";sug=null}
$("suggest").onclick=openDlg;$("dcancel").onclick=()=>dlg.style.display="none";
addEventListener("keydown",e=>{if(e.key==="Escape"&&dlg.style.display==="flex")dlg.style.display="none"});
function showSug(r){
  sug=r;const body=$("dbody");body.replaceChildren();
  const any=r.papers.some(p=>p.add.length);
  $("dsub").textContent=any?"Untick any tag you don't want, then apply. ★ marks a paper's primary tag (the first suggested one, for papers with no tags yet). "+(r.new_tags.length?"New tags are marked and highlighted: "+r.new_tags.join(", ")+". ":"")+"Cost $"+r.cost.toFixed(3)+".":"Nothing to add: every paper already has fitting tags. (Cost $"+r.cost.toFixed(3)+".)";
  r.papers.filter(p=>p.add.length).forEach(p=>{const g=el("div","sg");g.append(el("div","st",p.title));
    if(p.have.length)g.append(el("div","have","Has: "+p.have.join(", ")));
    const star=()=>{if(p.have.length)return;let f=true;g.querySelectorAll("label").forEach(l=>{const on=l.firstChild.checked,k=l.querySelector(".pk");if(k)k.textContent=on&&f?"★ ":"";if(on)f=false})};
    p.add.forEach(t=>{const l=el("label",r.new_tags.includes(t)?"new":""),c=document.createElement("input");c.type="checkbox";c.checked=true;c.dataset.stem=p.stem;c.dataset.tag=t;c.onchange=star;
      const tx=document.createElement(r.new_tags.includes(t)?"b":"span");tx.textContent=t;l.append(c,el("span","pk"),tx);g.append(l)});star();
    if(p.have.length)g.querySelector(".have").textContent="Has: "+p.have.map((t,k)=>k?t:"★ "+t).join(", ")+" (primary stays "+p.have[0]+")";
    body.append(g)});
  $("onlyun").parentElement.style.display="none";$("dgo").textContent="Apply selected";$("dgo").disabled=!any;$("dlgt").textContent="Suggested tags"}
$("dgo").onclick=async()=>{
  const b=$("dgo");b.disabled=true;
  if(!sug){b.textContent="Thinking…";$("dsub").textContent="Reading the papers: this can take a minute for a big project.";
    try{showSug(await post(BASE+"/tags/suggest",{only_untagged:$("onlyun").checked?"1":"0"}))}catch(e){toast(e.message);$("dsub").textContent=e.message;b.textContent="Suggest";b.disabled=false}
    return}
  const assign={};dlg.querySelectorAll("input[data-stem]:checked").forEach(c=>{(assign[c.dataset.stem]=assign[c.dataset.stem]||[]).push(c.dataset.tag)});
  try{const r=await post(BASE+"/tags/apply",{assign:JSON.stringify(assign)});
    papers.forEach(p=>{const add=assign[p.stem]||[];p.tags=[...new Set([...p.tags,...add])].slice(0,12)});vocab=r.vocab;dlg.style.display="none";render();toast("Tagged "+r.changed+" paper"+(r.changed===1?"":"s")+".")}
  catch(e){toast(e.message);b.disabled=false}};
render();
})();
</script></body></html>
