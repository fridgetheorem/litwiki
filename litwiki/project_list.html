<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project papers · litwiki</title>
<style>
__THEME__
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.bar .sp{flex:1}.bar a.b{text-decoration:none}
input[type=search],input.tin{padding:.35rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1;min-width:10rem;max-width:22rem}
.b{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:.4rem .9rem;font:inherit;font-weight:600;cursor:pointer}
.b.sec{background:none;color:var(--acc);border:1px solid var(--acc)}
#tagbar{display:flex;gap:.4rem;flex-wrap:wrap;padding:.6rem 1rem 0}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .65rem;background:none;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#list{display:flex;flex-direction:column;gap:.6rem;padding:1rem}
.p{display:flex;gap:.7rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem}
.p.drag{opacity:.45}.p.over{border-color:var(--acc)}
.mv{display:flex;flex-direction:column;align-items:center;gap:.1rem;color:var(--mut);user-select:none}
.mv .h{cursor:grab;font-size:1.1rem;line-height:1}.mv button{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 .3rem;font-size:.8rem;line-height:1.1}.mv button:hover{color:var(--acc)}
.n{width:1.8rem;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:.1rem}
.bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.bd h3{margin:0;font-size:1rem;line-height:1.3}.bd h3 a{color:var(--fg);text-decoration:none}.bd h3 a:hover{color:var(--acc)}
.by{font-size:.84rem;color:var(--mut)}
.tg{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.tg .t{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 .2rem 0 .6rem;display:inline-flex;align-items:center;gap:.15rem}
.tg .t button{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 .3rem;font-size:.9rem}
.tg .t button:hover{color:var(--bad)}
input.tin{font-size:.82rem;padding:.1rem .5rem;width:9rem}
.row{display:flex;gap:.9rem;font-size:.84rem;flex-wrap:wrap}.row a,.row button{color:var(--acc);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:none}
.row button.un{color:var(--mut)}
#empty{padding:3rem 1rem;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem 1rem;border-radius:8px;display:none;z-index:9;max-width:90vw}
</style></head><body>
__NAV__<div class="pview">
__TABS__
<div class="bar"><input id="q" type="search" placeholder="Filter this project's papers"><span id="info" class="by"></span><span class="sp"></span>
<a class="b" href="__ADD__">+ Add papers</a></div>
<div id="tagbar"></div>
<div id="list"></div><div id="empty" style="display:none"></div></div>
<div id="toast" role="status"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById("data").textContent),CSRF="__CSRF__",BASE="/app/project/"+encodeURIComponent(D.slug);
let papers=D.papers,q="",tag="",dragFrom=null;
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4000)}
async function post(path,params){
  const body=new URLSearchParams({_csrf:CSRF});for(const[k,v] of Object.entries(params||{}))(Array.isArray(v)?v:[v]).forEach(x=>body.append(k,x));
  const r=await fetch(path,{method:"POST",body,credentials:"same-origin"});
  if(r.redirected&&r.url.includes("/app/login"))throw new Error("Session expired: log in again, then reload.");
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.error||(r.status===403?"Session expired: reload this page.":"Server error ("+r.status+")"));
  return j}
const filtering=()=>!!(q||tag);
function matches(p){const w=q.toLowerCase().split(/\s+/).filter(Boolean),h=(p.title+" "+p.authors+" "+p.venue+" "+p.year+" "+p.tags.join(" ")).toLowerCase();
  return w.every(x=>h.includes(x))&&(!tag||p.tags.includes(tag))}
async function saveOrder(){try{await post(BASE+"/order",{stem:papers.map(p=>p.stem)})}catch(e){toast(e.message)}}
function move(i,j){if(j<0||j>=papers.length||i===j)return;const[x]=papers.splice(i,1);papers.splice(j,0,x);render();saveOrder()}
async function setTags(p,tags){try{const r=await post(BASE+"/tags",{stem:p.stem,tags});p.tags=r.tags;render()}catch(e){toast(e.message)}}
async function unlink(p){
  if(!confirm("Remove “"+p.title+"” from this project? The paper stays in your library."))return;
  try{await post(BASE+"/act",{action:"unlink",id:"page:"+p.stem});papers=papers.filter(x=>x!==p);render();toast("Removed from project.")}catch(e){toast(e.message)}}
function row(p){
  const i=papers.indexOf(p),d=el("div","p");d.draggable=!filtering();
  const mv=el("div","mv");
  if(!filtering()){const h=el("span","h","⋮⋮");h.title="Drag to reorder";mv.append(h);
    const u=el("button","","▲");u.type="button";u.title="Move up";u.onclick=()=>move(i,i-1);
    const dn=el("button","","▼");dn.type="button";dn.title="Move down";dn.onclick=()=>move(i,i+1);mv.append(u,dn)}
  d.append(mv,el("div","n",""+(i+1)));
  const b=el("div","bd"),h3=el("h3"),a=el("a","",p.title);a.href="/papers/"+encodeURIComponent(p.stem)+"/";h3.append(a);b.append(h3);
  const by=[p.authors,[p.venue,p.year].filter(Boolean).join(" ")].filter(Boolean).join(" · ");if(by)b.append(el("div","by",by));
  const tg=el("div","tg");
  p.tags.forEach(t=>{const s=el("span","t",t),x=el("button","","×");x.type="button";x.title="Remove tag";x.onclick=()=>setTags(p,p.tags.filter(y=>y!==t));s.append(x);tg.append(s)});
  const inp=el("input","tin");inp.placeholder="+ tag";inp.setAttribute("list","alltags");inp.maxLength=40;
  inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();setTags(p,[...p.tags,inp.value.trim()])}};
  tg.append(inp);b.append(tg);
  const r=el("div","row");
  const w=el("a","","Wiki page");w.href="/papers/"+encodeURIComponent(p.stem)+"/";r.append(w);
  if(p.pdf){const a2=el("a","","Read & annotate");a2.href="/app/paper/"+encodeURIComponent(p.stem)+"/read";r.append(a2)}
  const n=el("a","","Notes");n.href=BASE+"/notes";r.append(n);
  const un=el("button","un","Remove from project");un.type="button";un.onclick=()=>unlink(p);r.append(un);
  b.append(r);d.append(b);
  d.ondragstart=e=>{dragFrom=i;d.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",""+i)}catch(_){}};
  d.ondragend=()=>{d.classList.remove("drag");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))};
  d.ondragover=e=>{if(dragFrom!==null){e.preventDefault();d.classList.add("over")}};d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();const f=dragFrom;dragFrom=null;if(f!==null)move(f,i)};
  return d}
function render(){
  const all=[...new Set(papers.flatMap(p=>p.tags))].sort(),tb=$("tagbar");tb.replaceChildren();
  if(tag&&!all.includes(tag))tag="";
  if(all.length){const c0=el("button","chip"+(tag?"":" on"),"All");c0.type="button";c0.onclick=()=>{tag="";render()};tb.append(c0);
    all.forEach(t=>{const c=el("button","chip"+(tag===t?" on":""),t);c.type="button";c.onclick=()=>{tag=t;render()};tb.append(c)})}
  let dl=$("alltags");if(!dl){dl=document.createElement("datalist");dl.id="alltags";document.body.append(dl)}
  dl.replaceChildren(...all.map(t=>{const o=document.createElement("option");o.value=t;return o}));
  const sh=papers.filter(matches),L=$("list"),active=document.activeElement&&document.activeElement.classList.contains("tin");
  L.replaceChildren(...sh.map(row));
  $("info").textContent=sh.length===papers.length?papers.length+" paper"+(papers.length===1?"":"s"):sh.length+" of "+papers.length+" shown (clear the filter to reorder)";
  const e=$("empty");e.style.display=sh.length?"none":"block";
  e.replaceChildren();
  if(!papers.length){e.append("No papers in this project yet. ");const a=el("a","","Add papers");a.href=D.add;e.append(a,".")}else e.textContent="Nothing matches this filter."}
$("q").oninput=e=>{q=e.target.value;render()};
render();
})();
</script></body></html>
