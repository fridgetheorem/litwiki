[project]
name = "litwiki"
version = "0.1.0"
description = "Lightweight literature-review wiki: Zotero + daily discovery -> Markdown vault -> static site"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "mkdocs-material>=9.5",
]

[project.scripts]
litwiki = "litwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litwiki"]
